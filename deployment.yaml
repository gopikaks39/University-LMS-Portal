
apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: university-lms
  template:
    metadata:
      labels:
        app: university-lms
    spec:
      containers:
        - name: university-lms
          image: gopikaks/university-lms-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: university-lms-service
spec:
  type: NodePort
  selector:
    app: university-lms
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30011
